<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Booking | UniTravels</title>
    <meta name="description" content="Book real Indian Railways trains — Rajdhani, Shatabdi, Vande Bharat, Duronto and more across 120+ cities.">
    <link rel="icon" type="image/jpeg" href="train.jpg?v=13">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body data-dynamic="train">
    <header>
        <img src="train.jpg" alt="logo" height="140" width="150">
        <div id="logo">
            <h1>UniTravels</h1>
            <nav>
                <a href="bus.html">Home</a>
                <a href="aboutus.html">AboutUs</a>
                <a href="contactus.html">Contact</a>
            </nav>
        </div>
    </header>

    <div class="side">
        <a href="bus.html"><button id="box1">
            <img src="bus.jpg" alt="" height="100" width="100">
            <span><b>Bus Travel</b></span>
        </button></a>
        <a href="train.html"><button id="box2" class="active">
            <img src="train.jpg" alt="" height="100" width="100">
            <span><b>Train Travel</b></span>
        </button></a>
        <a href="car.html"><button id="box3">
            <img src="car.jpg" alt="" height="100" width="100">
            <span><b>Car Travel</b></span>
        </button></a>
        <a href="ideaaboutplaces.html"><button id="box4">
            <img src="idea.jpg" alt="" height="100" width="100">
            <span><b>Idea of Place</b></span>
        </button></a>
    </div>

    <div id="web">
        <h2 class="searchTitle">Travel India by train 🚆</h2>
        <p class="searchSub">Real trains • real station codes • real classes &amp; fares — city ya station code (NDLS, HWH…) dono chalte hain</p>
        <div class="place">
            <div class="field">
                <label for="location">From</label>
                <input id="location" list="cityList" placeholder="City or station code (e.g. Delhi / NDLS)" autocomplete="off" required>
            </div>
            <button type="button" id="swapBtn" class="swapBtn" title="Swap cities">⇄</button>
            <div class="field">
                <label for="destination">To</label>
                <input id="destination" list="cityList" placeholder="City or station code (e.g. Kolkata / HWH)" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="date">Journey Date</label>
                <input type="date" id="date">
            </div>
        </div>
        <div class="Search">
            <button type="button" id="trainSearchBtn">🔍 Search Trains</button>
        </div>
        <p id="loginMessage"></p>
        <div class="popularRoutes" id="popularRoutes"></div>
    </div>
    <datalist id="cityList"></datalist>

    <div class="trustStrip">
        <span>🚄 Vande Bharat &amp; Rajdhani</span>
        <span>🎫 SL • 3A • 2A • 1A • CC • EC</span>
        <span>📅 Weekly running days</span>
        <span>🎧 24×7 support</span>
    </div>

    <div id="tavail" style="display: none;"></div>

    <script src="data.js?v=13"></script>
    <script src="app.js?v=13"></script>
    <script src="train.js?v=13"></script>
</body>
</html>
