<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Guide | UniTravels</title>
    <meta name="description" content="Curated real hotels, sights, restaurants and must-try food for India's top destinations.">
    <link rel="icon" type="image/jpeg" href="idea.jpg?v=11">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body data-dynamic>
    <header>
        <img src="idea.jpg" alt="logo" height="140" width="150">
        <div id="logo">
            <h1>UniTravels</h1>
            <nav>
                <a href="bus.html">Home</a>
                <a href="aboutus.html">AboutUs</a>
                <a href="contactus.html">Contact</a>
            </nav>
        </div>
    </header>
    <div class="side">
        <a href="bus.html"><button id="box1">
            <img src="bus.jpg" alt="" height="100" width="100">
            <span><b>Bus Travel</b></span>
        </button></a>
        <a href="train.html"><button id="box2">
            <img src="train.jpg" alt="" height="100" width="100">
            <span><b>Train Travel</b></span>
        </button></a>
        <a href="car.html"><button id="box3">
            <img src="car.jpg" alt="" height="100" width="100">
            <span><b>Car Travel</b></span>
        </button></a>
        <a href="ideaaboutplaces.html"><button id="box4" class="active">
            <img src="idea.jpg" alt="" height="100" width="100">
            <span><b>Idea of Place</b></span>
        </button></a>
    </div>

    <div id="web">
        <h2 class="searchTitle">Idea of Place 🗺️</h2>
        <p class="searchSub">Real hotels • real sights • real restaurants &amp; street food — curated guides for India's top destinations</p>
        <div class="place">
            <div class="field">
                <label for="location">From (optional)</label>
                <input id="location" list="cityList" placeholder="e.g. Indore" autocomplete="off">
            </div>
            <button type="button" id="swapBtn" class="swapBtn" title="Swap cities">⇄</button>
            <div class="field">
                <label for="destination">Guide for (destination)</label>
                <input id="destination" list="cityList" placeholder="City or station code (e.g. Jaipur / JP)" autocomplete="off" required>
            </div>
        </div>
        <div class="Search">
            <button type="button" id="ideaSearchBtn">️ Show Me the Guide</button>
        </div>
        <p id="loginMessage"></p>
        <div class="popularRoutes" id="popularRoutes"></div>
    </div>
    <datalist id="cityList"></datalist>

    <div class="trustStrip">
        <span>🏨 Handpicked hotels</span>
        <span>📍 Iconic sights</span>
        <span>🍽️ Famous restaurants</span>
        <span>🍛 Must-try local food</span>
    </div>

    <div id="Iavail" style="display: none;"></div>

    <script src="data.js?v=11"></script>
    <script src="guides2.js?v=11"></script>
    <script src="app.js?v=11"></script>
    <script src="idea.js?v=11"></script>
</body>
</html>
