<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Booking | UniTravels</title>
    <meta name="description" content="Book intercity outstation cabs — Dzire, Ertiga, Innova Crysta and Tempo Travellers across 120+ Indian cities.">
    <link rel="icon" type="image/jpeg" href="car.jpg?v=11">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body data-dynamic="car">
    <header>
        <img src="car.jpg" alt="logo" height="140" width="150">
        <div id="logo">
            <h1>UniTravels</h1>
            <nav>
                <a href="bus.html">Home</a>
                <a href="aboutus.html">AboutUs</a>
                <a href="contactus.html">Contact</a>
            </nav>
        </div>
    </header>

    <div class="side">
        <a href="bus.html"><button id="box1">
            <img src="bus.jpg" alt="" height="100" width="100">
            <span><b>Bus Travel</b></span>
        </button></a>
        <a href="train.html"><button id="box2">
            <img src="train.jpg" alt="" height="100" width="100">
            <span><b>Train Travel</b></span>
        </button></a>
        <a href="car.html"><button id="box3" class="active">
            <img src="car.jpg" alt="" height="100" width="100">
            <span><b>Car Travel</b></span>
        </button></a>
        <a href="ideaaboutplaces.html"><button id="box4">
            <img src="idea.jpg" alt="" height="100" width="100">
            <span><b>Idea of Place</b></span>
        </button></a>
    </div>

    <div id="web">
        <h2 class="searchTitle">Intercity cabs, door to door 🚗</h2>
        <p class="searchSub">Sedans, SUVs &amp; Tempo Travellers • transparent per-km fares</p>
        <div class="place">
            <div class="field">
                <label for="location">From</label>
                <input id="location" list="cityList" placeholder="Pickup city" autocomplete="off" required>
            </div>
            <button type="button" id="swapBtn" class="swapBtn" title="Swap cities">⇄</button>
            <div class="field">
                <label for="destination">To</label>
                <input id="destination" list="cityList" placeholder="Drop city" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="date">Pickup Date</label>
                <input type="date" id="date">
            </div>
        </div>
        <div class="tripToggle">
            <label class="chipToggle"><input type="radio" name="tripType" id="tripOne" checked> One way</label>
            <label class="chipToggle"><input type="radio" name="tripType" id="tripRound"> Round trip <span class="saveBadge">save 5%</span></label>
        </div>
        <div class="Search">
            <button type="button" id="carSearchBtn">🔍 Search Cars</button>
        </div>
        <p id="loginMessage"></p>
        <div class="popularRoutes" id="popularRoutes"></div>
    </div>
    <datalist id="cityList"></datalist>

    <div class="trustStrip">
        <span>🧑‍✈️ Verified drivers</span>
        <span>⛽ Fuel &amp; driver bata included</span>
        <span>🛣️ Door-to-door pickup</span>
        <span>🎧 24×7 support</span>
    </div>

    <div id="cavail" style="display: none;"></div>

    <script src="data.js?v=11"></script>
    <script src="app.js?v=11"></script>
    <script src="car.js?v=11"></script>
</body>
</html>
