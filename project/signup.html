<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | UniTravels</title>
    <link rel="icon" type="image/jpeg" href="bus.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(120deg, #08214d, #0a2e6e 55%, #1a5cff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.97);
            align-items: center;
            text-align: center;
            padding: 30px 24px;
            width: 380px;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(3, 15, 40, 0.45);
        }
        .container h1 {
            color: #08214d;
            font-size: 1.5em;
            margin: 0 0 4px;
            letter-spacing: 0.4px;
        }
        .container .brand { font-size: 2em; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border: 1.5px solid #cfd9ea;
            border-radius: 12px;
            font-size: 1em;
            background: #fbfcfe;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #1a5cff;
            box-shadow: 0 0 0 4px rgba(26, 92, 255, 0.12);
        }
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(120deg, #0aa06e, #12c48b);
            color: white;
            border: none;
            border-radius: 12px;
            margin: 14px 0 0 0;
            font-size: 1.02em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(10, 160, 110, 0.35);
            transition: filter 0.2s, transform 0.15s;
        }
        button:hover { filter: brightness(1.06); transform: translateY(-1px); }
        #loginMessage { font-weight: 600; margin-top: 12px; font-size: 0.95em; }
        .login p { margin-top: 14px; font-size: 0.95em; color: #475569; }
        a { color: #1a5cff; font-weight: 700; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .backLink { display: block; margin-top: 10px; font-size: 0.88em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="Login">
            <div class="brand">🚌</div>
            <h1>Create your account</h1>
            <p style="color:#64748b; font-size:0.9em; margin-bottom:12px;">Join UniTravels and book trips in seconds</p>
            <input type="text" id="name" placeholder="Enter your Name">
            <input type="email" id="email" placeholder="Enter your Email">
            <input type="password" id="password" placeholder="Enter your Password">
            <button onclick="signUp()" id="sign-link">✨ Sign Up</button>
            <p id="loginMessage"></p>
        </div>
        <div class="login">
            <p>Have an account? <a href="Login.html">Sign in</a></p>
            <a class="backLink" href="bus.html">← Back to search</a>
        </div>
    </div>
    <script>
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let isLoggedIn = JSON.parse(sessionStorage.getItem('isLoggedIn')) || false;
        let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;
        let selectedRide = {};

        function signUp() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginMsg = document.getElementById('loginMessage');

            if (!name || !email || !password) {
                loginMsg.textContent = "Please fill in all the fields.";
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                loginMsg.textContent = "Please enter a valid email address.";
                return;
            }
            if (password.length < 6) {
                loginMsg.textContent = "Password must be at least 6 characters.";
                return;
            }
            if (users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
                loginMsg.textContent = "That username is taken. Try another or login.";
                return;
            }
            if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                loginMsg.textContent = "An account with this email already exists.";
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));
            loginMsg.textContent = "Sign up successful! Redirecting to login…";
            loginMsg.style.color = "green";
            setTimeout(function () {
                window.location.href = "Login.html";
            }, 900);
        }

        /* Enter key submits the form */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') signUp();
        });
    </script>
</body>
</html>
