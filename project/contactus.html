<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTravels</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
    <header>
        <img src="bus.jpg" alt="logo" height="140" width="150">
        <div id="logo">
            <h1>UniTravels</h1>
            <a href="bus.html">Home</a>
            <a href="aboutus.html">AboutUs</a>
            <a href="contactus.html">ContactUs</a>
        </div>
    </header>
    <div class="main">
        <h1>Contact Us</h1>
        <p style="text-align:center; margin-bottom:20px;">
            📞 +91 98765 43210 &nbsp;|&nbsp; ✉️ <a href="mailto:support@unitravels.com">support@unitravels.com</a> &nbsp;|&nbsp; 📍 Indore, Madhya Pradesh, India
        </p>
        <div class="form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button onclick="Submit()" type="submit" id="Submit">Submit</button>
            <p id="SubmitMessage"></p>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 UniTravels. All Rights Reserved.</p>
    </footer>
    <script>
        function Submit() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            const SubmitMsg = document.getElementById('SubmitMessage');

            if (!name || !email || !message) {
                SubmitMsg.textContent = "Please fill in all the details.";
                SubmitMsg.style.color = "red";
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                SubmitMsg.textContent = "Please enter a valid email address.";
                SubmitMsg.style.color = "red";
                return;
            }

            /* keep a copy of the message locally so nothing is lost */
            const inbox = JSON.parse(localStorage.getItem('unitravels_messages') || '[]');
            inbox.unshift({ name, email, message, at: new Date().toISOString() });
            localStorage.setItem('unitravels_messages', JSON.stringify(inbox));

            SubmitMsg.textContent = "✅ Thanks " + name + "! Your message has been sent — we'll reply to " + email + " soon.";
            SubmitMsg.style.color = "green";
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
